[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "knowledge-spider"
version = "1.0.0"
description = "Autonomous web crawling and knowledge graph engine powered by NLP and SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KnowledgeSpider Engine" }]
keywords = ["web-crawler", "knowledge-graph", "nlp", "spider", "autonomous"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlmodel>=0.0.18",
    "loguru>=0.7",
    "toml>=0.10",
    "spacy>=3.7",
    "sumy>=0.11",
    "nltk>=3.8",
    "networkx>=3.3",
    "typer>=0.12",
    "rich>=13.7",
    "duckduckgo-search>=6.1",
]

[project.scripts]
spider = "knowledge_spider.cli.main:app"

[project.urls]
Repository = "https://github.com/mohammed18salah/data-spider"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_spider*"]
