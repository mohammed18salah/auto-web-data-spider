<!doctype html>
<html lang="en" data-theme="dark" dir="ltr" style="background-color: #030305; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Auto Web Data Spider - Autonomous Web Data Gathering & Knowledge Discovery Engine" />
    <title>Auto Web Data Spider</title>
    <style>
      /* Immediate Dark Baseline to prevent any white flash */
      html, body {
        background-color: #030305 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: transparent;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('spider_theme');
          var savedLang = localStorage.getItem('spider_lang');
          if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#f1f5f9';
            document.documentElement.style.color = '#0f172a';
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#030305';
            document.documentElement.style.color = '#f8fafc';
          }
          if (savedLang === 'ar') {
            document.documentElement.setAttribute('lang', 'ar');
            document.documentElement.setAttribute('dir', 'rtl');
          } else {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #030305; color: #f8fafc;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
